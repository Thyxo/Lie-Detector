name: MindTrace
options:
  bundleIdPrefix: dk.thyxo
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MindTrace:
    type: application
    platform: iOS
    sources: [MindTrace]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.mindtrace
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MindTrace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSMotionUsageDescription: "Used to measure the magnetic field."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose an image for secret mode."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconGlow AppIconClassic"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  # Logik-tests (detektion) – kører på Mac uden iPhone
  MindTraceLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MindTraceTests
      - path: MindTrace/Vec3.swift
      - path: MindTrace/Detector.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.mindtrace.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  # UI-tests på iPhone-simulator
  MindTraceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MindTraceUITests]
    dependencies:
      - target: MindTrace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.mindtrace.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MindTrace

schemes:
  MindTraceLogicTests:
    build:
      targets:
        MindTraceLogicTests: [test]
    test:
      targets: [MindTraceLogicTests]
  MindTrace:
    build:
      targets:
        MindTrace: all
        MindTraceUITests: [test]
    test:
      targets: [MindTraceUITests]

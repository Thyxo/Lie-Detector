name: Fetch sounds

on:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-sounds.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from myinstants
        run: |
          set -e
          mkdir -p sounds
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          get() {
            page=$(curl -fsSL -A "$UA" "https://www.myinstants.com/en/instant/$1/")
            path=$(echo "$page" | grep -oE "/media/sounds/[^\"' )]+\.mp3" | head -1)
            echo "$1 -> $path"
            curl -fsSL -A "$UA" "https://www.myinstants.com$path" -o "sounds/$2"
            file "sounds/$2"; ls -l "sounds/$2"
          }
          get true-sound-effect-27272 true.mp3
          get false-sound-effect-40521 false.mp3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds
          git commit -m "Lyde: sandt/falsk fra myinstants" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Build IPA

on:
  push:
    branches: [main]
    paths: ["ios/**", "sounds/**", "scripts/**", ".github/workflows/ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MindTrace.xcodeproj -scheme MindTrace \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 200

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindTrace.app Payload/
          zip -qry MindTrace.ipa Payload
          ls -lh MindTrace.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MindTrace-ipa
          path: ios/MindTrace.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MindTrace 1.0.${{ github.run_number }}
          body: "Usigneret IPA. Installér via SideStore-kilden, AltStore eller Sideloadly (gratis Apple ID)."
          files: ios/MindTrace.ipa
          make_latest: true

      - name: Update SideStore source
        run: |
          python3 scripts/make_source.py "1.0.${{ github.run_number }}" "${{ github.run_number }}" ios/MindTrace.ipa \
            "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/MindTrace.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "SideStore-kilde: 1.0.${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main

name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MindTrace.xcodeproj -scheme MindTrace \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 200

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindTrace.app Payload/
          zip -qry MindTrace.ipa Payload
          ls -lh MindTrace.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MindTrace-ipa
          path: ios/MindTrace.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MindTrace build ${{ github.run_number }}
          body: "Usigneret IPA. Installér med AltStore eller Sideloadly (gratis Apple ID)."
          files: ios/MindTrace.ipa
          make_latest: true

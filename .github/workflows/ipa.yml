name: Build IPA

on:
  push:
    branches: [main, dev]
    paths: ["ios/**", "sounds/**", "scripts/**", ".github/workflows/ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Logic tests (detection)
        working-directory: ios
        run: |
          rc=0
          xcodebuild test -project MindTrace.xcodeproj -scheme MindTraceLogicTests -destination 'platform=macOS' > test.log 2>&1 || rc=$?
          grep -E "Test Case|error:|TEST SUCCEEDED|TEST FAILED" test.log | tail -n 80 || true
          [ $rc -eq 0 ] || tail -n 60 test.log
          exit $rc

      - name: Build (unsigned)
        working-directory: ios
        run: |
          rc=0
          xcodebuild -project MindTrace.xcodeproj -scheme MindTrace \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || rc=$?
          grep -E "error:|warning: .*/MindTrace/|BUILD" build.log | sort -u | tail -n 120 || true
          [ $rc -eq 0 ] || tail -n 60 build.log
          exit $rc

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindTrace.app Payload/
          plutil -p Payload/MindTrace.app/Info.plist | grep -A12 "CFBundleIcons\"" | head -40
          plutil -p Payload/MindTrace.app/Info.plist | grep -q "AppIconGlow" || { echo "Alternative ikoner mangler"; exit 1; }
          zip -qry MindTrace.ipa Payload
          ls -lh MindTrace.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MindTrace-ipa
          path: ios/MindTrace.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MindTrace 1.0.${{ github.run_number }}
          body: "Usigneret IPA. Installér via SideStore-kilden, AltStore eller Sideloadly (gratis Apple ID)."
          files: ios/MindTrace.ipa
          make_latest: true

      - name: Update SideStore source
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/make_source.py "1.0.${{ github.run_number }}" "${{ github.run_number }}" ios/MindTrace.ipa \
            "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/MindTrace.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "SideStore-kilde: 1.0.${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
